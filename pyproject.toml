[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroclassify"
version = "0.1.0"
description = "Industrial-grade text & telemetry signal classification pipeline with sub-millisecond CPU inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sayandeep Ghosh", email = "sayandeepghosh2023@gmail.com"}
]
dependencies = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
neuroclassify = "neuroclassify.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
